# When a PR is merged: open a PR to the next environment (develop→staging or staging→main).
# Only one job runs per event: merged into develop → create PR to staging; merged into staging → create PR to main.
#
# Token (403 "not permitted to create or approve pull requests"):
# - Default: `github.token` needs repo Settings → Actions → General → Workflow permissions:
#   "Read and write permissions" AND "Allow GitHub Actions to create and approve pull requests".
# - If your org/repo blocks that, add secret `GH_PAT` (classic PAT, `repo` scope); this workflow prefers it when set.
#   https://docs.github.com/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token
name: Create PR to Next Environment

on:
  pull_request:
    types: [closed]

jobs:
  create-staging-pr:
    name: Open PR (develop → staging)
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR from develop to staging
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || title || '';
            const headRef = `${context.repo.owner}:develop`;
            try {
              const { data } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: 'develop',
                base: 'staging'
              });
              core.notice(`Created PR #${data.number}: ${data.html_url}`);
            } catch (err) {
              if (err.status === 403) {
                core.setFailed(
                  'GitHub Actions cannot create pull requests in this repository (403). Fix one of: ' +
                  '(1) Settings → Actions → General → Workflow permissions: enable "Read and write permissions" and turn ON ' +
                  '"Allow GitHub Actions to create and approve pull requests"; ' +
                  '(2) Add repository secret GH_PAT using a classic PAT with the `repo` scope (this workflow uses GH_PAT when set). ' +
                  `GitHub said: ${err.message}`
                );
                return;
              }
              if (err.status === 422) {
                const { data: existing } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: headRef,
                  base: 'staging'
                });
                if (existing.length > 0) {
                  core.notice(`PR from develop to staging already exists: #${existing[0].number} ${existing[0].html_url}`);
                } else {
                  core.notice('A PR from develop to staging already exists.');
                }
              } else {
                throw err;
              }
            }

  create-production-pr:
    name: Open PR (staging → main)
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create PR from staging to main
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT || github.token }}
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || title || '';
            const headRef = `${context.repo.owner}:staging`;
            try {
              const { data } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: 'staging',
                base: 'main'
              });
              core.notice(`Created PR #${data.number}: ${data.html_url}`);
            } catch (err) {
              if (err.status === 403) {
                core.setFailed(
                  'GitHub Actions cannot create pull requests in this repository (403). Fix one of: ' +
                  '(1) Settings → Actions → General → Workflow permissions: enable "Read and write permissions" and turn ON ' +
                  '"Allow GitHub Actions to create and approve pull requests"; ' +
                  '(2) Add repository secret GH_PAT using a classic PAT with the `repo` scope (this workflow uses GH_PAT when set). ' +
                  `GitHub said: ${err.message}`
                );
                return;
              }
              if (err.status === 422) {
                const { data: existing } = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  head: headRef,
                  base: 'main'
                });
                if (existing.length > 0) {
                  core.notice(`PR from staging to main already exists: #${existing[0].number} ${existing[0].html_url}`);
                } else {
                  core.notice('A PR from staging to main already exists.');
                }
              } else {
                throw err;
              }
            }
